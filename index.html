<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">

    <title>Fondueflow</title>

    <!-- Fondueflow CSS minified stylesheet -->
    <link rel="stylesheet" href="dist/styles/fondueflow.css">
    <!-- Fondueflow JavaScript minified script -->
     <script src="dist/scripts/fondueflow.js" defer></script>
</head>
<body>
    <main role="main">

        <!-- Section and Container -->
        <section class="ff-section">
            <div class="ff-container">
                <h1>This is a Container</h1>
            </div>
        </section>
        <!-- / END: Section and Container -->

        <!-- Grid -->
        <section class="ff-section">
            <div class="ff-container">
                <div class="ff-row">
                    <div class="ff-col">Auto</div>
                    <div class="ff-col">Auto</div>
                    <div class="ff-col">Auto</div>
                </div>
                <div class="ff-row">
                    <div class="ff-col-3">col-3</div>
                    <div class="ff-col-6">col-6</div>
                    <div class="ff-col-3">col-3</div>
                </div>
                <div class="ff-row">
                    <div class="ff-col-12 ff-col-md-6 ff-col-lg-4">Column A</div>
                    <div class="ff-col-12 ff-col-md-6 ff-col-lg-4">Column B</div>
                    <div class="ff-col-12 ff-col-md-12 ff-col-lg-4">Column C</div>
                </div>
            </div>
        </section>
        <!-- / END: Grid -->

        <!-- Component: Card -->
        <section class="ff-section">
            <div class="ff-container">
                <div class="ff-card-container">
                    <div class="ff-card">
                        <div class="ff-card__content">
                            <p>This is a card.</p>
                            <p>This is a card.</p>
                            <p>This is a card.</p>
                            <p>This is a card.</p>
                        </div>
                    </div>
                    <div class="ff-card">
                        <div class="ff-card__content">
                            This is a second card.
                        </div>
                    </div>
                    <div class="ff-card">
                        <div class="ff-card__content">
                            This is a second card.
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <!-- / END: Component: Card -->

    </main>
</body>
</html>
